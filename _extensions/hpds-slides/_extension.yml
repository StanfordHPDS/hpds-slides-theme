title: hpds-slides
author: Malcolm Barrett
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      logo: su_identity_red.png
      theme: [custom.scss]
      preview-links: true
      chalkboard:
        theme: whiteboard
        boardmarker-width: 3
        buttons: false
      title-slide-attributes:
        data-background-image: "hpdslogo.png"
        data-background-position: 50% 95%
        data-background-size: 150px
      # allow mathjax
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      # hide logo on section slides
      # based on https://github.com/quarto-dev/quarto-cli/discussions/557#discussioncomment-2522814
      include-after: |
        <script>
          // Grab a reference to the logo img once:
          const logoImg = document.querySelector('img.slide-logo');
  
          // Helper: hide or show the logo
          function updateLogoVisibility(current) {
            if ( current.classList.contains('title-slide') 
                 && current.classList.contains('level1') ) {
              logoImg.style.display = 'none';
            } else {
              logoImg.style.display = '';
            }
          }
  
          // When Reveal is first ready, check which slide is active:
          Reveal.on('ready', event => {
            // event.currentSlide is the <section> that’s showing
            updateLogoVisibility(event.currentSlide);
          });
  
          // Whenever the slide changes, run the same check:
          Reveal.on('slidechanged', event => {
            updateLogoVisibility(event.currentSlide);
          });
          
          // Implement proper parent grouping for incremental bullets
          function updateBulletOpacity() {
            const currentSlide = Reveal.getCurrentSlide();
            if (!currentSlide) return;
            
            // Reset all opacity
            currentSlide.querySelectorAll('.fragment').forEach(f => {
              f.style.opacity = '';
            });
            
            // Find which fragment is current
            const currentFragment = currentSlide.querySelector('.fragment.current-fragment');
            if (!currentFragment) return;
            
            // Find the top-level parent of the current fragment
            function getTopLevelParent(element) {
              let topLevel = element;
              let parent = element.parentElement;
              
              while (parent && parent !== currentSlide) {
                if (parent.tagName === 'LI' && parent.classList.contains('fragment')) {
                  topLevel = parent;
                }
                parent = parent.parentElement;
              }
              
              return topLevel;
            }
            
            const currentTopLevel = getTopLevelParent(currentFragment);
            
            // Find all top-level fragments (those without fragment parents)
            const topLevelFragments = Array.from(currentSlide.querySelectorAll('.fragment')).filter(f => {
              // Check if this fragment has a parent that is also a fragment
              let parent = f.parentElement;
              while (parent && parent !== currentSlide) {
                if (parent.classList && parent.classList.contains('fragment')) {
                  return false; // This is a nested fragment
                }
                parent = parent.parentElement;
              }
              return true; // This is a top-level fragment
            });
            
            // Apply opacity only to top-level fragments
            topLevelFragments.forEach(fragment => {
              if (fragment.classList.contains('visible') && fragment !== currentTopLevel) {
                // This top-level fragment has been shown but is not the current group
                fragment.style.opacity = '0.25';
              }
            });
          }
          
          // Update on fragment changes
          Reveal.on('fragmentshown', updateBulletOpacity);
          Reveal.on('fragmenthidden', updateBulletOpacity);
          Reveal.on('slidechanged', updateBulletOpacity);
          Reveal.on('ready', updateBulletOpacity);
        </script>

